name: Release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build production image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker build --target prod \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" .
      - name: Publish to GHCR
        id: publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          ref=$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          docker pull "$ref"
          echo "image=$ref" >> "$GITHUB_OUTPUT"
          printf 'Published `%s`\n' "$ref" >> "$GITHUB_STEP_SUMMARY"

  delivery:
    needs: image
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-release
      cancel-in-progress: false
    permissions:
      id-token: write
      packages: read
    steps:
      - name: Join the private deployment network
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: api.tailscale.com/${{ vars.TS_CLIENT_ID }}
          tags: tag:release-ci
          use-cache: false
      - name: Verify or deploy the published digest
        env:
          MODE: ${{ github.event_name == 'release' && 'release' || 'probe' }}
          IMAGE: ${{ needs.image.outputs.image }}
          HOST: ${{ secrets.RELEASE_HOST }}
          HOST_KEY: ${{ secrets.RELEASE_HOST_KEY }}
          KEY: ${{ secrets.RELEASE_KEY }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$KEY" > "$dir/key"
          printf '%s\n' "$HOST_KEY" > "$dir/known_hosts"
          printf '%s' "$TOKEN" | ssh -T -p 2222 -i "$dir/key" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=release-host \
            -o UserKnownHostsFile="$dir/known_hosts" "release-organic@$HOST" \
            "$MODE ${IMAGE##*@} $GITHUB_SHA $GITHUB_REPOSITORY_OWNER"
