name: Release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build production image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker build --target prod \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" .
      - name: Publish to GHCR
        id: publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          ref=$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          docker pull "$ref"
          echo "image=$ref" >> "$GITHUB_OUTPUT"
          printf 'Published `%s`\n' "$ref" >> "$GITHUB_STEP_SUMMARY"
