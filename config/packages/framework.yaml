framework:
  trusted_proxies: '%env(TRUSTED_PROXIES)%'
  trusted_headers: ['x-forwarded-proto']
  secret: '%env(APP_SECRET)%'
  default_locale: fr
  csrf_protection: true
  form: true
  validation: { enable_attributes: true }
  session:
    save_path: '%env(SESSION_SAVE_PATH)%'
    cookie_httponly: true
    cookie_samesite: lax
    cookie_secure: auto
  router: { utf8: true }
  handle_all_throwables: true
  cache:
    directory: '%env(APP_CACHE_DIR)%'
  rate_limiter:
    assistant:
      policy: sliding_window
      limit: 12
      interval: '10 minutes'
when@test:
  framework:
    test: true
    session: { storage_factory_id: session.storage.factory.mock_file }
