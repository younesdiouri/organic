doctrine:
  dbal:
    url: '%env(DATABASE_URL)%'
    charset: utf8
    # Immutable invoice ledger is intentionally managed with DBAL + explicit migrations.
    schema_filter: '~^(?!supplier_invoice$)~'
  orm:
    mappings:
      App:
        type: attribute
        dir: '%kernel.project_dir%/src/Entity'
        prefix: App\Entity
        is_bundle: false
