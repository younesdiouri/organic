security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
  providers:
    admins:
      entity: { class: App\Entity\Admin, property: email }
  firewalls:
    main:
      lazy: true
      provider: admins
      form_login:
        login_path: login
        check_path: login
        enable_csrf: true
        default_target_path: home
        always_use_default_target_path: true
      login_throttling: { max_attempts: 5, interval: '15 minutes' }
      logout:
        path: logout
        target: login
        enable_csrf: true
  access_control:
    - { path: ^/connexion$, roles: PUBLIC_ACCESS }
    - { path: ^/, roles: ROLE_ADMIN }
